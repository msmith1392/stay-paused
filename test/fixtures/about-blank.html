<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Borrowed play() from an about:blank iframe</title>
    <link rel="stylesheet" href="style.css" />
    <script src="status.js"></script>
  </head>
  <body>
    <p><a href="./">All fixtures</a></p>
    <h1>Borrowed play() from an about:blank iframe</h1>
    <p class="expect">
      Expect: PAUSED. A page should not get around the gate by using another frame's play().
    </p>
    <video data-name="about-blank" src="clip.wav" loop controls></video>
    <pre id="status"></pre>
    <script>
      const frame = document.createElement('iframe');
      frame.style.display = 'none';
      document.body.appendChild(frame);
      const borrowed = frame.contentWindow.HTMLMediaElement.prototype.play;
      logResult('borrowed play on load', borrowed.call(document.querySelector('video')));
    </script>
  </body>
</html>
