<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Small promo tile</title>
    <link rel="stylesheet" href="store.css" />
    <style>
      html,
      body {
        width: 440px;
        height: 280px;
        background: linear-gradient(140deg, #1e293b, #0f172a);
        color: #fff;
      }

      .tile {
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        padding: 0 40px;
      }

      .tile img {
        width: 72px;
        height: 72px;
        margin: -9px 0 14px -9px;
        filter: drop-shadow(0 4px 12px rgb(0 0 0 / 0.25));
      }

      .tile h1 {
        margin: 0 0 8px;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .tile p {
        margin: 0;
        font-size: 18px;
        line-height: 1.4;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <img src="../../public/icons/icon.svg" alt="" />
      <h1>Stay Paused</h1>
      <p>Stop autoplay in background tabs.</p>
    </div>
  </body>
</html>
