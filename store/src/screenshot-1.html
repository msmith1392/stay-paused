<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Screenshot 1: background tabs</title>
    <link rel="stylesheet" href="store.css" />
  </head>
  <body>
    <div class="scene">
      <div class="copy">
        <div class="brand">
          <img src="../../public/icons/icon.svg" alt="" />
          Stay Paused
        </div>
        <h1>Background tabs stay paused.</h1>
        <p>
          Open a few videos in new tabs and come back whenever you like. Nothing plays until you
          click.
        </p>
      </div>

      <div class="window">
        <div class="tabs">
          <div class="tab"><span class="dot"></span><span>Knife skills for beginners</span></div>
          <div class="tab active">
            <span class="dot"></span><span>Lecture 4: Linear algebra</span>
          </div>
          <div class="tab"><span class="dot"></span><span>Trail running highlights</span></div>
          <div class="tab"><span class="dot"></span><span>Bread baking, part 2</span></div>
        </div>
        <div class="address">videos.example.com/watch</div>
        <div class="player">
          <div class="play"></div>
          <div class="pill">Waiting for you</div>
        </div>
        <div class="meta">
          <div class="title"></div>
          <div class="sub"></div>
        </div>
      </div>
    </div>
  </body>
</html>
